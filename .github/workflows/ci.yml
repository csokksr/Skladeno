name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Збірка
        run: python -I tools/build.py
      - name: Перевірка завдань і кольорів
        run: python -I tools/validate.py
      - name: Формат модулів src/content
        run: python -I tools/check_schema.py
      - name: Текст інтерфейсу
        run: python -I tools/check_text.py
      - name: Журнал змін актуальний
        run: node tools/changelog.js --check
      - name: Регресійні тести
        run: node tests/run.js
      - name: Покриття іменованих функцій тестами
        run: node tools/coverage.js --min 45
      - name: Тести скриптів Python
        run: python -m unittest discover -s tests/py -v
      - name: Збірка відтворювана
        run: |
          before=$(sha256sum dist/skladeno-nmt.html)
          python -I tools/build.py
          test "$before" = "$(sha256sum dist/skladeno-nmt.html)"
      - name: Хеш збірки
        run: sha256sum dist/skladeno-nmt.html | cut -d' ' -f1 > build-hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-hash-${{ matrix.os }}
          path: build-hash.txt
          overwrite: true
  same-hash:
    name: Збірка однакова на Linux і Windows
    needs: check
    runs-on: ubuntu-latest
    # Інформаційна перевірка: розбіжність показує, що збірка залежить від системи, але не блокує зміни.
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: hashes
      - name: Порівняння
        run: |
          a=$(cat hashes/build-hash-ubuntu-latest/build-hash.txt)
          b=$(cat hashes/build-hash-windows-latest/build-hash.txt)
          echo "linux:   $a"
          echo "windows: $b"
          test "$a" = "$b"
  static:
    name: Лінтер і типи
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (глобальні імена з усіх модулів)
        run: node tools/lint.js
      - name: Типи (tsc, checkJs)
        run: node tools/typecheck.js
  e2e:
    name: Тести в браузері (Playwright, axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -I tools/build.py --web
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -I tools/build.py --web
      - run: npm ci
      - run: npx lhci autorun
